<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Path 3D · Leola's Library</title><link rel="stylesheet" href="game.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script></head><body><div id="game"></div><div class="top"><div class="card"><a class="back" href="arcade.html">← Arcade</a><h1 id="title"></h1><p id="objective"></p></div><div class="card stats"><span>Correct <b id="score">0</b></span><span id="status">Round 1</span></div></div><div id="msg" class="message"></div><div class="controls"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button class="action" data-key="Space">BOOST</button><div class="help">Steer: ← → / A D · Speed: ↑ ↓ · Choose the gate matching Leola's instruction</div><script type="module">
import {THREE,makeRenderer,floor,hook,labelSprite,input,hud,clamp,save} from './core.js';
const {renderer,scene,camera}=makeRenderer(0x0d1020);floor(scene,160);const ui=hud({title:'Pattern Path 3D',objective:'Steer through the stitch gate Leola asks for.'}),ctl=input();const player=hook(0xf4e8ff);player.scale.setScalar(.7);player.rotation.z=-Math.PI/2;player.position.set(0,1.8,6);scene.add(player);camera.position.set(0,7,15);camera.lookAt(0,1,-18);const choices=[['SC','single crochet'],['HDC','half double crochet'],['DC','double crochet'],['SL ST','slip stitch'],['CH','chain']];let gates=[],round=0,score=0,speed=12,last=performance.now(),active=true,target='';function buildGate(x,label,correct){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:correct?0x425a68:0x6b465e,emissive:correct?0x17394a:0x28111e,emissiveIntensity:.25});for(const px of [-1.7,1.7]){const p=new THREE.Mesh(new THREE.BoxGeometry(.35,4.7,.35),mat);p.position.set(px,2.35,0);g.add(p)}const top=new THREE.Mesh(new THREE.BoxGeometry(3.75,.35,.35),mat);top.position.set(0,4.6,0);g.add(top);const s=labelSprite(label);s.position.set(0,3.35,.2);s.scale.set(3.1,1,1);g.add(s);g.position.set(x,0,-48);g.userData={label,correct};scene.add(g);return g}function nextRound(){gates.forEach(g=>scene.remove(g));gates=[];round++;const correct=choices[Math.floor(Math.random()*choices.length)];target=correct[0];let opts=[correct];while(opts.length<3){const c=choices[Math.floor(Math.random()*choices.length)];if(!opts.includes(c))opts.push(c)}opts.sort(()=>Math.random()-.5);[-5,0,5].forEach((x,i)=>gates.push(buildGate(x,opts[i][0],opts[i][0]===target)));ui.objective(`Leola says: go through ${correct[1]} (${correct[0]}).`);ui.status('Round '+round)}nextRound();const msg=t=>{const e=document.querySelector('#msg');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),700)};renderer.setAnimationLoop(now=>{const dt=Math.min((now-last)/1000,.04);last=now;if(active){let dir=0;if(ctl.down('ArrowLeft','KeyA'))dir-=1;if(ctl.down('ArrowRight','KeyD'))dir+=1;if(ctl.down('ArrowUp','KeyW'))speed=clamp(speed+8*dt,10,22);if(ctl.down('ArrowDown','KeyS'))speed=clamp(speed-10*dt,8,22);if(ctl.down('Space'))speed=22;player.position.x=clamp(player.position.x+dir*8*dt,-7,7);player.rotation.y+=(dir*.35-player.rotation.y)*dt*8;for(const g of gates)g.position.z+=speed*dt;const front=gates[0]?.position.z??-99;if(front>3){let chosen=gates.reduce((a,b)=>Math.abs(b.position.x-player.position.x)<Math.abs(a.position.x-player.position.x)?b:a,gates[0]);if(chosen.userData.correct){score++;msg('Correct: '+target);ui.score(score)}else{msg('Wrong gate: '+chosen.userData.label)}if(round>=10){active=false;ui.status('FINISH');ui.objective(`Pattern complete: ${score}/10 correct. Press Enter to replay.`);save('pattern-path',{score})}else nextRound()}}renderer.render(scene,camera)});addEventListener('keydown',e=>{if(!active&&e.code==='Enter')location.reload()});
</script></body></html>
