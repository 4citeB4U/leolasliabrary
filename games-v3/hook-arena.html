<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hook & Loop Arena · Leola's Library</title><link rel="stylesheet" href="game.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script></head><body><div id="game"></div><div class="top"><div class="card"><a class="back" href="arcade.html">← Arcade</a><h1 id="title"></h1><p id="objective"></p></div><div class="card stats"><span>Loops <b id="score">0</b>/12</span><span id="status">READY</span></div></div><div id="msg" class="message"></div><div class="controls"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button class="action" data-key="Space">HOOK</button><div class="help">Move: arrows / WASD · Hook a nearby glowing loop: Space</div><script type="module">
import {makeRenderer,floor,hook,ring,knot,input,hud,clamp,distXZ,pulse,save} from './core.js';
const {renderer,scene,camera}=makeRenderer(0x0d1517);floor(scene,70);const ui=hud({title:'Hook & Loop Arena',objective:'Drive the hook into range of a glowing loop, then press SPACE to pull it through.'}),ctl=input();const player=hook(0xf1f1f5);player.scale.setScalar(.82);player.position.set(0,2,7);scene.add(player);camera.position.set(0,9,17);const loops=[],hazards=[];let score=0,last=performance.now(),done=false;for(let i=0;i<12;i++){const r=ring([0x65efc3,0xff79bd,0x86a7ff][i%3],.8);r.position.set((Math.random()-.5)*30,1.5,(Math.random()-.5)*30);r.userData.phase=Math.random()*6.28;scene.add(r);loops.push(r)}for(let i=0;i<7;i++){const h=knot();h.position.set((Math.random()-.5)*28,.8,(Math.random()-.5)*28);scene.add(h);hazards.push(h)}const msg=t=>{const e=document.querySelector('#msg');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),650)};renderer.setAnimationLoop(now=>{const dt=Math.min((now-last)/1000,.04);last=now;if(!done){let mx=0,mz=0;if(ctl.down('ArrowLeft','KeyA'))mx-=1;if(ctl.down('ArrowRight','KeyD'))mx+=1;if(ctl.down('ArrowUp','KeyW'))mz-=1;if(ctl.down('ArrowDown','KeyS'))mz+=1;const len=Math.hypot(mx,mz)||1;player.position.x=clamp(player.position.x+mx/len*7*dt,-31,31);player.position.z=clamp(player.position.z+mz/len*7*dt,-31,31);if(mx||mz)player.rotation.y=Math.atan2(mx,-mz);for(const [i,l] of loops.entries()){l.userData.phase+=dt;l.position.y=1.5+Math.sin(l.userData.phase*2)*.35;l.rotation.y+=dt*.8;pulse(l,now/1000+i,.08)}for(const h of hazards){h.rotation.y+=dt*.55;if(distXZ(player.position,h.position)<1.35){player.position.x*=.96;player.position.z*=.96;ui.status('SNARL')}}if(ctl.consume('Space')){let best=null,bd=2.4;for(const l of loops){if(!l.visible)continue;const d=distXZ(player.position,l.position);if(d<bd){bd=d;best=l}}if(best){best.visible=false;score++;msg('Loop pulled through!');ui.score(score);ui.status('CLEAN LOOP');if(score===12){done=true;ui.status('MASTERED');ui.objective('Arena cleared — all 12 loops completed.');save('hook-arena',{score})}}else{msg('Move closer to a loop')}}camera.position.x+=(player.position.x-camera.position.x)*dt*2.7;camera.position.z+=(player.position.z+13-camera.position.z)*dt*2.7;camera.lookAt(player.position.x,1.4,player.position.z-2)}renderer.render(scene,camera)});
</script></body></html>
