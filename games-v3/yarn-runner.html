<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yarn Runner 3D · Leola's Library</title><link rel="stylesheet" href="game.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script></head><body><div id="game"></div><div class="top"><div class="card"><a class="back" href="arcade.html">← Arcade</a><h1 id="title"></h1><p id="objective"></p></div><div class="card stats"><span>Score <b id="score">0</b></span><span id="status">60s</span></div></div><div id="msg" class="message"></div><div class="controls"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button class="action" data-key="Space">JUMP</button><div class="help">Keyboard: ← → or A/D to change lanes · Space to jump</div><script type="module">
import {THREE,makeRenderer,floor,hook,yarnBall,knot,input,hud,pulse,save} from './core.js';
const {renderer,scene,camera}=makeRenderer(0x130e18);floor(scene,140);camera.position.set(0,6.4,12);camera.lookAt(0,1,-12);const ui=hud({title:'Yarn Runner 3D',objective:'Collect yarn balls. Jump over snarls. Survive 60 seconds.'});const ctl=input();const player=hook(0xe5e7ee);player.rotation.z=-.2;player.position.set(0,2,0);scene.add(player);const lanes=[-4,0,4];let lane=1,targetX=0,vy=0,onGround=true,score=0,timeLeft=60,last=performance.now(),spawn=0,gameOver=false;const objects=[];for(let z=-10;z>-110;z-=10){const rail=new THREE.Mesh(new THREE.BoxGeometry(11,.15,.2),new THREE.MeshStandardMaterial({color:0x8f6242}));rail.position.set(0,.07,z);scene.add(rail)}function addObj(){const good=Math.random()>.38;const o=good?yarnBall([0xff6f91,0xffbd59,0x74e0c1,0x88a7ff][Math.floor(Math.random()*4)],.7):knot();o.userData.good=good;o.position.set(lanes[Math.floor(Math.random()*3)],good?1.1:.9,-75);scene.add(o);objects.push(o)}function flash(t){const m=document.querySelector('#msg');m.textContent=t;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),650)}addEventListener('keydown',e=>{if(gameOver&&e.code==='Enter')location.reload()});renderer.setAnimationLoop((now)=>{const dt=Math.min((now-last)/1000,.035);last=now;if(!gameOver){timeLeft-=dt;spawn-=dt;if(spawn<=0){spawn=.62;addObj()}if((ctl.consume('ArrowLeft')||ctl.consume('KeyA'))&&lane>0)lane--;if((ctl.consume('ArrowRight')||ctl.consume('KeyD'))&&lane<2)lane++;targetX=lanes[lane];if((ctl.consume('Space')||ctl.consume('ArrowUp')||ctl.consume('KeyW'))&&onGround){vy=7.8;onGround=false}player.position.x+=(targetX-player.position.x)*Math.min(1,dt*12);vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<=2){player.position.y=2;vy=0;onGround=true}player.rotation.y+=(targetX-player.position.x)*dt*.22;for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.position.z+=18*dt;o.rotation.y+=dt*1.4;if(o.userData.good)pulse(o,now/1000,.05);const dx=Math.abs(o.position.x-player.position.x),dz=Math.abs(o.position.z-player.position.z);if(dx<1.3&&dz<1.1){if(o.userData.good){score+=10;flash('+10 yarn')}else if(player.position.y<3.1){score=Math.max(0,score-15);flash('Snarl! -15')}scene.remove(o);objects.splice(i,1);continue}if(o.position.z>15){scene.remove(o);objects.splice(i,1)}}ui.score(score);ui.status(Math.max(0,Math.ceil(timeLeft))+'s');if(timeLeft<=0){gameOver=true;ui.status('FINISH');ui.objective('Run complete — press Enter to race again.');save('yarn-runner',{score});flash('Final score '+score)}camera.position.x+=(player.position.x*.22-camera.position.x)*dt*3}renderer.render(scene,camera)});
</script></body></html>
