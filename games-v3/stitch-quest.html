<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stitch Quest 3D · Leola's Library</title><link rel="stylesheet" href="game.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script></head><body><div id="game"></div><div class="top"><div class="card"><a class="back" href="arcade.html">← Arcade</a><h1 id="title"></h1><p id="objective"></p></div><div class="card stats"><span>Found <b id="score">0</b>/5</span><span id="status">90s</span></div></div><div id="msg" class="message"></div><div class="controls"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button class="action" data-key="Space">PICK</button><div class="help">Explore: arrows / WASD · Collect nearby token: E or Space · Find them in order</div><script type="module">
import {THREE,makeRenderer,floor,hook,labelSprite,yarnBall,input,hud,distXZ,pulse,save} from './core.js';
const {renderer,scene,camera}=makeRenderer(0x17110d);floor(scene,64);const ui=hud({title:'Stitch Quest 3D',objective:'Find stitch tokens in order: CH → SC → HDC → DC → SL ST.'}),ctl=input();const player=hook(0xffe4c7);player.scale.setScalar(.62);player.position.set(-12,1.7,12);scene.add(player);const walls=[];function wall(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,3,d),new THREE.MeshStandardMaterial({color:0x5a3d2b,roughness:.8}));m.position.set(x,1.5,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);walls.push(m)}wall(0,-15,28,1);wall(0,15,28,1);wall(-15,0,1,30);wall(15,0,1,30);wall(-5,-5,1,16);wall(5,6,1,18);wall(0,1,10,1);wall(-9,7,11,1);wall(10,-8,9,1);for(const [x,z] of [[-11,-10],[-1,-10],[10,-12],[-11,11],[11,11],[0,11]]){const b=yarnBall([0x9d566f,0x5f8c77,0xc79354][Math.floor(Math.random()*3)],1.1);b.position.set(x,1.2,z);scene.add(b)}const sequence=['CH','SC','HDC','DC','SL ST'],spots=[[-11,-11],[-1,-12],[11,-4],[0,10],[12,11]],tokens=[];sequence.forEach((name,i)=>{const g=new THREE.Group();const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(.9,2),new THREE.MeshStandardMaterial({color:0xe6bd69,emissive:0x6d4411,emissiveIntensity:.5,metalness:.25}));g.add(orb);const s=labelSprite(name);s.position.set(0,1.6,0);s.scale.set(2.5,.75,1);g.add(s);g.position.set(spots[i][0],1.2,spots[i][1]);g.userData={name,index:i};scene.add(g);tokens.push(g)});let current=0,time=90,last=performance.now(),done=false;const msg=t=>{const e=document.querySelector('#msg');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),700)};function blocked(nx,nz){if(nx<-13.8||nx>13.8||nz<-13.8||nz>13.8)return true;for(const w of walls){const b=new THREE.Box3().setFromObject(w).expandByScalar(.45);if(b.containsPoint(new THREE.Vector3(nx,1.5,nz)))return true}return false}renderer.setAnimationLoop(now=>{const dt=Math.min((now-last)/1000,.04);last=now;if(!done){time-=dt;let mx=0,mz=0;if(ctl.down('ArrowLeft','KeyA'))mx-=1;if(ctl.down('ArrowRight','KeyD'))mx+=1;if(ctl.down('ArrowUp','KeyW'))mz-=1;if(ctl.down('ArrowDown','KeyS'))mz+=1;const len=Math.hypot(mx,mz)||1,nx=player.position.x+mx/len*6*dt,nz=player.position.z+mz/len*6*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;if(mx||mz)player.rotation.y=Math.atan2(mx,-mz);tokens.forEach((t,i)=>{if(t.visible){t.rotation.y+=dt*.6;pulse(t,now/1000+i,.08)}});if(ctl.consume('Space')||ctl.consume('KeyE')){let best=null,bd=2.2;for(const t of tokens){if(!t.visible)continue;const d=distXZ(player.position,t.position);if(d<bd){bd=d;best=t}}if(!best)msg('No token close enough');else if(best.userData.index!==current)msg('Leola says: find '+sequence[current]+' first');else{best.visible=false;current++;ui.score(current);msg('Collected '+best.userData.name);if(current===sequence.length){done=true;ui.status('COMPLETE');ui.objective('Quest complete — you found the stitch sequence in order.');save('stitch-quest',{score:current,timeLeft:time})}else ui.objective('Next token: '+sequence[current])}}if(time<=0&&!done){done=true;ui.status('TIME');ui.objective('Time expired. Press Enter to try the quest again.')}camera.position.x+=(player.position.x-camera.position.x)*dt*3;camera.position.z+=(player.position.z+8-camera.position.z)*dt*3;camera.position.y=7;camera.lookAt(player.position.x,1,player.position.z-3);ui.status(done?document.querySelector('#status').textContent:Math.max(0,Math.ceil(time))+'s')}renderer.render(scene,camera)});addEventListener('keydown',e=>{if(done&&e.code==='Enter')location.reload()});
</script></body></html>
