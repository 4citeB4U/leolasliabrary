<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leola's Library · 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0a0c;color:#fff6e8;font-family:Inter,system-ui,sans-serif}#scene{position:fixed;inset:0}.hud{position:fixed;z-index:10;left:18px;top:18px;background:#171018cc;border:1px solid #e6bd6950;border-radius:16px;padding:14px 16px;backdrop-filter:blur(12px);max-width:520px}.hud h1{font:800 28px Georgia,serif;color:#ffe0a3;margin:0 0 4px}.hud p{margin:0;font-size:13px;line-height:1.45}.status{position:fixed;z-index:10;right:18px;top:18px;background:#171018cc;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;font-size:12px}.enter{position:fixed;z-index:15;left:50%;bottom:11%;transform:translateX(-50%);border:1px solid #e6bd69;background:#2a1b18;color:#ffe0a3;border-radius:999px;padding:15px 24px;font-weight:900;font-size:16px;box-shadow:0 12px 40px #000a;cursor:pointer}.hint{position:fixed;z-index:11;left:50%;bottom:24px;transform:translateX(-50%);background:#171018cc;border:1px solid #ffffff22;border-radius:999px;padding:9px 14px;font-size:12px;white-space:nowrap}.cross{position:fixed;z-index:9;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#fff8}.cross:before{width:18px;height:2px;top:8px}.cross:after{height:18px;width:2px;left:8px}.touch{position:fixed;z-index:12;left:15px;bottom:18px;display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px;gap:4px}.touch button{border:1px solid #ffffff2e;background:#171018c9;color:white;border-radius:13px;font-size:20px;touch-action:none}.touch .up{grid-column:2}.touch .left{grid-row:2;grid-column:1}.touch .down{grid-row:2;grid-column:2}.touch .right{grid-row:2;grid-column:3}.panel{position:fixed;z-index:20;right:18px;bottom:18px;width:min(420px,calc(100vw - 36px));background:#fff8eef5;color:#2b211e;border-radius:20px;padding:18px;display:none;box-shadow:0 25px 80px #000a}.panel.show{display:block}.panel h2{margin:0 0 8px;color:#5b3421;font:800 28px Georgia,serif}.panel p{line-height:1.5}.panel a{display:inline-block;margin:5px 6px 0 0;text-decoration:none;background:#5b3421;color:white;border-radius:999px;padding:10px 13px;font-weight:800}.panel button{float:right;border:0;border-radius:50%;width:34px;height:34px;background:#2b211e;color:white;cursor:pointer}@media(max-width:700px){.hud{left:9px;top:9px;max-width:72vw}.hud h1{font-size:20px}.status{right:9px;top:9px}.hint{display:none}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script></head><body><div id="scene"></div><div class="hud"><h1>Leola's Library</h1><p>A real-time 3D library. Walk with WASD or arrow keys. Drag the mouse to look around. Click a glowing shelf, book, arcade cabinet, or Leola.</p></div><div class="status" id="status">Doors closed</div><div class="cross"></div><button class="enter" id="enter">Enter Leola's Library</button><div class="hint">WASD / arrows = walk · mouse drag = look · click glowing objects</div><div class="touch"><button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button></div><aside class="panel" id="panel"><button id="close">×</button><h2 id="ptitle"></h2><p id="ptext"></p><div id="plinks"></div></aside><script type="module">
import * as THREE from 'three';
const root=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0x100c0b);scene.fog=new THREE.Fog(0x100c0b,18,70);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,120);camera.position.set(0,2.1,16);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffecd1,0x241316,2.2));const sun=new THREE.DirectionalLight(0xfff7e8,2.6);sun.position.set(5,12,9);sun.castShadow=true;scene.add(sun);const accent=new THREE.PointLight(0xff85c8,18,30);accent.position.set(-8,5,-8);scene.add(accent);const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,60),new THREE.MeshStandardMaterial({color:0x5b3825,roughness:.86}));floor.rotation.x=-Math.PI/2;floor.position.z=-10;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(42,28,0xc89b53,0x6c472f);grid.position.z=-10;grid.position.y=.01;scene.add(grid);function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.78}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}box(-20,4,-10,1,8,60,0x332119);box(20,4,-10,1,8,60,0x332119);box(0,7.8,-10,40,1,60,0x2b1b16);box(0,4,-39,40,8,1,0x3b281f);const interactive=[];function shelf(x,z,rot=0,label='Books'){const g=new THREE.Group();const sideMat=new THREE.MeshStandardMaterial({color:0x6b3d25,roughness:.75});for(const sx of [-2.8,2.8]){const s=new THREE.Mesh(new THREE.BoxGeometry(.35,5.7,1.1),sideMat);s.position.set(sx,2.85,0);g.add(s)}for(const sy of [.3,2,3.7,5.4]){const p=new THREE.Mesh(new THREE.BoxGeometry(6,.22,1.2),sideMat);p.position.set(0,sy,0);g.add(p)}for(let r=0;r<3;r++)for(let i=0;i<7;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.48,1.25,.7),new THREE.MeshStandardMaterial({color:[0x9c4f3c,0x486d60,0x76548b,0xbe8b4e][(i+r)%4]}));b.position.set(-2.25+i*.73,1.02+r*1.7,.05);g.add(b)}g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);g.userData.interaction={title:label,text:'Choose a book from Leola’s shelves.',links:[['Needle & Yarn','d6jq33mv39.html'],['Crochet Mastery','0lbzci75tc.html']]};interactive.push(g);return g}shelf(-10,-7,.12,'Reading Shelf');shelf(10,-7,-.12,'Crochet Shelf');shelf(-10,-22,.12,'Story Collection');function sign(text,x,y,z){const c=document.createElement('canvas'),q=c.getContext('2d');c.width=768;c.height=180;q.fillStyle='rgba(31,18,19,.9)';q.roundRect(8,8,752,164,30);q.fill();q.strokeStyle='#e6bd69';q.lineWidth=7;q.stroke();q.fillStyle='#fff3d8';q.font='800 58px Georgia';q.textAlign='center';q.textBaseline='middle';q.fillText(text,384,92);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.position.set(x,y,z);s.scale.set(8,1.9,1);scene.add(s);return s}sign("LEOLA'S LIBRARY",0,6.2,3);sign('3D CROCHET ARCADE',10,5.7,-20);const cabinet=box(10,2.2,-20,5.6,4.4,2.2,0x392343);cabinet.material.emissive=new THREE.Color(0x3b1538);cabinet.material.emissiveIntensity=.4;cabinet.userData.interaction={title:'3D Crochet Arcade',text:'Four new real-time WebGL games with keyboard and joystick-style controls.',links:[['Enter the Arcade','games-v3/arcade.html']]};interactive.push(cabinet);const learning=box(0,2,-31,7,4,1.4,0x345b4b);learning.material.emissive=new THREE.Color(0x0f342a);learning.material.emissiveIntensity=.35;learning.userData.interaction={title:'Learn With Leola',text:'Crochet lessons, grounded Q&A, and the coming Leola-hosted video series.',links:[['Ask Leola','leola-ai-lab.html'],['Support the Library','donations-v2.html']]};interactive.push(learning);sign('LEARN WITH LEOLA',0,5,-30.4);const loader=new THREE.TextureLoader();const portrait=loader.load('images/sister-lee/g444d1542de54243d3e02fe079aab4205c00a05b232cc40066cb39f802281f98c3b9bda3530c79a1a1dc6f1f9b036b879_640.png');portrait.colorSpace=THREE.SRGBColorSpace;const leola=new THREE.Sprite(new THREE.SpriteMaterial({map:portrait,transparent:true}));leola.position.set(0,3,-20);leola.scale.set(4.5,4.5,1);leola.userData.interaction={title:'Leola',text:'Welcome to my library. Read, learn crochet, play in the 3D arcade, or ask me a question.',links:[['Read Needle & Yarn','d6jq33mv39.html'],['Play 3D Games','games-v3/arcade.html'],['Ask Leola','leola-ai-lab.html']]};scene.add(leola);interactive.push(leola);const doorL=box(-2.55,3.25,7,5,6.5,.5,0x2a201b),doorR=box(2.55,3.25,7,5,6.5,.5,0x2a201b);let entered=false,doorT=0;document.querySelector('#enter').onclick=()=>{entered=true;document.querySelector('#enter').style.display='none';document.querySelector('#status').textContent='Doors opening'};const keys=new Set();addEventListener('keydown',e=>keys.add(e.code));addEventListener('keyup',e=>keys.delete(e.code));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys.add(k)},off=e=>{e.preventDefault();keys.delete(k)};b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;b.onpointercancel=off});let yaw=0,pitch=-.04,drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.004;pitch-=(e.clientY-ly)*.003;pitch=Math.max(-.45,Math.min(.35,pitch));lx=e.clientX;ly=e.clientY});const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(!entered)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight*2-1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(interactive,true);if(!hits.length)return;let o=hits[0].object;while(o&&!o.userData.interaction)o=o.parent;if(o?.userData.interaction)show(o.userData.interaction)});const panel=document.querySelector('#panel');document.querySelector('#close').onclick=()=>panel.classList.remove('show');function show(d){document.querySelector('#ptitle').textContent=d.title;document.querySelector('#ptext').textContent=d.text;const x=document.querySelector('#plinks');x.innerHTML='';for(const [name,url] of d.links){const a=document.createElement('a');a.href=url;a.textContent=name;x.appendChild(a)}panel.classList.add('show')}const clock=new THREE.Clock();function loop(){const dt=Math.min(clock.getDelta(),.04);if(entered){doorT=Math.min(1,doorT+dt*.7);doorL.position.x=-2.55-doorT*5.4;doorR.position.x=2.55+doorT*5.4;if(doorT>.95)document.querySelector('#status').textContent='Explore the library';const speed=5.5,forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));const move=new THREE.Vector3();if(keys.has('KeyW')||keys.has('ArrowUp'))move.add(forward);if(keys.has('KeyS')||keys.has('ArrowDown'))move.sub(forward);if(keys.has('KeyD')||keys.has('ArrowRight'))move.add(right);if(keys.has('KeyA')||keys.has('ArrowLeft'))move.sub(right);if(move.lengthSq())move.normalize().multiplyScalar(speed*dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x+move.x,-18,18);camera.position.z=THREE.MathUtils.clamp(camera.position.z+move.z,-37,6.5)}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;interactive.forEach((o,i)=>{if(o.material?.emissive)o.material.emissiveIntensity=.25+Math.sin(performance.now()*.002+i)*.12});renderer.render(scene,camera);requestAnimationFrame(loop)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
