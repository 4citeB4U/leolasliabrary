<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reading Room - Leola's Library</title>
  <link rel="stylesheet" href="css/clay-materials.css">
  <link rel="stylesheet" href="css/clay-transitions.css">
</head>
<body class="clay-reader">
  <div id="leola-guidance" class="clay-speech-bubble" aria-live="polite" aria-atomic="true"></div>

  <main id="reading-table">
    <div class="clay-panel book-container" id="book-pages">
      <h2 id="book-title">Loading...</h2>
      <div id="page-content">Turn the page to begin.</div>
    </div>
  </main>

  <nav class="clay-panel controls" aria-label="Reading controls">
    <button id="btn-prev" class="clay-btn">← Prev</button>
    <button id="btn-bookmark" class="clay-btn">★ Bookmark</button>
    <button id="btn-next" class="clay-btn">Next →</button>
    <a href="index.html" class="clay-btn">↩ Return to Desk</a>
  </nav>

  <script type="module" src="js/state-manager.js"></script>
  <script type="module" src="js/book-reader.js"></script>
  <script type="module" src="js/app-router.js"></script>
</body>
</html>
